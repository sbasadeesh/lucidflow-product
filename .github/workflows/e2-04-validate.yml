name: E2-04 Screenshot Stability Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  test-pr-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record PR head revision
        id: pr-head
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Discover and verify E2-04 test files
        run: |
          echo "=== Environment ==="
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          npm list playwright
          npx playwright --version
          echo ""
          echo "=== E2-04 Test File Discovery ==="
          DISCOVERED=$(find tests/E2-04_tests -type f -name '*_test.js' | sort)
          if [ -z "$DISCOVERED" ]; then
            echo "FAILURE: No E2-04 test files discovered"
            exit 1
          fi
          printf '%s\n' "$DISCOVERED"
          TEST_COUNT=$(printf '%s\n' "$DISCOVERED" | wc -l)
          echo "Total E2-04 test files: $TEST_COUNT"
          echo ""
          echo "=== PR Head Revision ==="
          echo "Tested revision: ${{ steps.pr-head.outputs.sha }}"

      - name: Run E2-04 tests on PR head
        timeout-minutes: 5
        run: |
          node --test tests/E2-04_tests/stableBetweenRuns_test/stableBetweenRuns_test.js tests/E2-04_tests/maskVolatile_test/maskVolatile_test.js tests/E2-04_tests/stabilizerUnit_test/stabilizerUnit_test.js tests/E2-04_tests/fullPageFloating_test/fullPageFloatingElement_test.js 2>&1 | tee test-output.log
          exit_code=${PIPESTATUS[0]}
          echo "Test exit code: $exit_code"
          exit $exit_code

      - name: Upload test output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-04-pr-head-test-output
          path: test-output.log
          retention-days: 30

      - name: Upload E2-04 test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2-04-pr-head-artifacts
          path: |
            tests/E2-04_tests/**/screenshots/
            tests/E2-04_tests/**/diff_images/
            tests/E2-04_tests/**/test-output/
            tests/E2-04_tests/**/logs/
          retention-days: 30

  test-integration-with-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record main revision
        id: main-sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Merge PR head into main (uncommitted)
        id: merge-integration
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git merge --no-commit --no-ff FETCH_HEAD
          TREE_SHA=$(git write-tree)
          echo "tree=$TREE_SHA" >> $GITHUB_OUTPUT
          echo "Integration tree (uncommitted merge): $TREE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Discover and verify test files
        run: |
          echo "=== Environment ==="
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          npm list playwright
          npx playwright --version
          echo ""
          echo "=== Test Revisions ==="
          echo "Main SHA: ${{ steps.main-sha.outputs.sha }}"
          echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Integration tree (uncommitted): ${{ steps.merge-integration.outputs.tree }}"
          echo ""
          echo "=== E2-04 Test File Discovery ==="
          DISCOVERED=$(find tests/E2-04_tests -type f -name '*_test.js' | sort)
          if [ -z "$DISCOVERED" ]; then
            echo "FAILURE: No E2-04 test files discovered"
            exit 1
          fi
          printf '%s\n' "$DISCOVERED"
          TEST_COUNT=$(printf '%s\n' "$DISCOVERED" | wc -l)
          echo "Total E2-04 test files: $TEST_COUNT"

      - name: Run E2-04 tests on integration candidate
        timeout-minutes: 5
        run: |
          node --test tests/E2-04_tests/stableBetweenRuns_test/stableBetweenRuns_test.js tests/E2-04_tests/maskVolatile_test/maskVolatile_test.js tests/E2-04_tests/stabilizerUnit_test/stabilizerUnit_test.js tests/E2-04_tests/fullPageFloating_test/fullPageFloatingElement_test.js 2>&1 | tee e2-04-test-output.log
          exit_code=${PIPESTATUS[0]}
          echo "E2-04 test exit code: $exit_code"
          exit $exit_code

      - name: Run npm test (E2-03 and E2-06 regressions)
        timeout-minutes: 5
        run: |
          npm test 2>&1 | tee regression-output.log
          exit_code=${PIPESTATUS[0]}
          echo "Regression test exit code: $exit_code"
          exit $exit_code

      - name: Upload test output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-04-integration-test-output
          path: |
            e2-04-test-output.log
            regression-output.log
          retention-days: 30

      - name: Upload E2-04 and regression test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2-04-integration-artifacts
          path: |
            tests/E2-04_tests/**/screenshots/
            tests/E2-04_tests/**/diff_images/
            tests/E2-04_tests/**/test-output/
            tests/E2-04_tests/**/logs/
          retention-days: 30
